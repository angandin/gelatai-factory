<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Cream Factory</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #14141e; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; color: #ccc; }
#left-panel { width: 200px; background: #1a1a2a; border-right: 2px solid #3c3c50; padding: 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
#left-panel h2 { color: #c8dcff; font-size: 14px; margin-bottom: 6px; text-align: center; }
.tool-btn { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid #333; border-radius: 4px; background: #1e1e2c; cursor: pointer; font-size: 12px; color: #96969a; transition: all 0.15s; }
.tool-btn:hover { background: #2a2a3c; }
.tool-btn.selected { border-color: #ffff64; color: #ffff64; background: #32324a; }
.tool-btn.delete-tool { border-color: #5a2020; color: #b46464; }
.tool-btn.delete-tool.selected { border-color: #ff7878; color: #ff7878; background: #3a2020; }
.tool-separator { height: 1px; background: #333; margin: 4px 0; }
.tool-section-label { font-size: 10px; color: #555; text-transform: uppercase; margin: 2px 0 0 0; letter-spacing: 1px; }
.tool-preview { width: 22px; height: 22px; flex-shrink: 0; }
#game-area { flex: 1; position: relative; }
#game-canvas { display: block; width: 100%; height: 100%; }
#right-panel { width: 300px; background: #1a1a2a; border-left: 2px solid #3c3c50; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
#right-panel h2 { color: #c8dcff; font-size: 14px; text-align: center; margin-bottom: 4px; }
.machine-card { background: #22222e; border: 1px solid #333; border-radius: 6px; padding: 8px; }
.machine-card h3 { font-size: 12px; color: #aab; margin-bottom: 4px; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
.badge-running { background: #1a4a1a; color: #6f6; }
.badge-stopped { background: #3a2a1a; color: #fa5; }
.badge-anomaly { background: #4a1a1a; color: #f66; }
.telemetry-row { display: flex; justify-content: space-between; font-size: 11px; padding: 1px 0; color: #888; }
.telemetry-row span:last-child { color: #aef; }
.machine-controls { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.machine-controls button { font-size: 10px; padding: 2px 6px; border: 1px solid #444; border-radius: 3px; background: #2a2a3a; color: #aaa; cursor: pointer; }
.machine-controls button:hover { background: #3a3a4a; color: #fff; }
#status-bar { position: absolute; bottom: 8px; left: 8px; background: rgba(20,20,30,0.85); padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #aaa; pointer-events: none; }
#help-text { font-size: 10px; color: #555; margin-top: auto; padding-top: 8px; border-top: 1px solid #333; line-height: 1.5; }
#save-load-bar { display: flex; gap: 4px; padding-top: 8px; border-top: 1px solid #333; }
#save-load-bar button { flex: 1; padding: 5px 0; border: 1px solid #3c5050; border-radius: 4px; background: #1e2c2c; color: #8cc; cursor: pointer; font-size: 11px; font-weight: bold; }
#save-load-bar button:hover { background: #2a3c3c; color: #aff; }
#save-load-bar button:active { background: #3a4c4c; }
#save-toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #2a4a2a; color: #8f8; padding: 6px 18px; border-radius: 6px; font-size: 13px; display: none; z-index: 999; border: 1px solid #4a6a4a; }
#machine-popup { position: fixed; display: none; z-index: 1000; background: #1e1e2e; border: 2px solid #5a5a7a; border-radius: 8px; padding: 12px; min-width: 200px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
#machine-popup h4 { margin: 0 0 8px; color: #c8dcff; font-size: 13px; }
#machine-popup .popup-status { font-size: 11px; color: #888; margin-bottom: 8px; }
#machine-popup .popup-actions { display: flex; flex-direction: column; gap: 4px; }
#machine-popup .popup-actions button { padding: 5px 10px; border: 1px solid #444; border-radius: 4px; background: #2a2a3a; color: #ccc; cursor: pointer; font-size: 11px; text-align: left; }
#machine-popup .popup-actions button:hover { background: #3a3a5a; color: #fff; }
#machine-popup .popup-actions button.btn-danger { border-color: #6a3030; color: #f88; }
#machine-popup .popup-actions button.btn-danger:hover { background: #4a2020; }
#machine-popup .popup-actions button.btn-success { border-color: #306a30; color: #8f8; }
#machine-popup .popup-actions button.btn-success:hover { background: #204a20; }
#machine-popup .popup-section { font-size: 10px; color: #666; text-transform: uppercase; margin: 6px 0 2px; letter-spacing: 0.5px; }
.tool-btn.selector-tool { border-color: #3a5a8a; color: #8ac; }
.tool-btn.selector-tool.selected { border-color: #64b4ff; color: #64b4ff; background: #1e2e4a; }
</style>
</head>
<body>

<div id="left-panel">
  <h2>ICE CREAM FACTORY</h2>
  <div id="tool-buttons"></div>
  <div id="save-load-bar">
    <button onclick="saveLayout()">&#128190; Save</button>
    <button onclick="loadLayout()">&#128194; Load</button>
  </div>
  <div id="help-text">
    <b>Controls:</b><br>
    L-Click: Place | R-Click: Delete<br>
    1-4: Belt direction | R: Rotate<br>
    Space: Pause/Resume<br>
    Scroll: Zoom | Mid/Arrows: Pan
  </div>
</div>
<div id="save-toast"></div>
<div id="machine-popup"></div>

<div id="game-area">
  <canvas id="game-canvas"></canvas>
  <div id="status-bar"></div>
</div>

<div id="right-panel">
  <h2>MACHINE STATUS</h2>
  <div id="machine-cards"></div>
</div>

<script>
// ============= CONSTANTS =============
const TILE = 32;
const GRID_W = 64, GRID_H = 64;
const MATERIAL_SPEED = 1.5;
const MACHINE_PROCESS_TIME = 2.0;
const SPAWN_INTERVAL = 2.0;

const CellType = {
  EMPTY: 0, CONV_R: 1, CONV_L: 2, CONV_D: 3, CONV_U: 4,
  MACHINE_PART: 5, START: 6, END: 7,
  // Machine types start at 100
  SCALE: 100, MIXER: 101, PASTEURIZER: 102, MIX_COOKER: 103,
  HOMOGENIZER: 104, AGING_TANK: 105, BATCH_FREEZER: 106,
  BLAST_FREEZER: 107, STORAGE_FREEZER: 108, COLD_ROOM: 109
};

const CONVEYOR_TYPES = [CellType.CONV_R, CellType.CONV_L, CellType.CONV_D, CellType.CONV_U];
const MACHINE_TYPES = [
  CellType.SCALE, CellType.MIXER, CellType.PASTEURIZER, CellType.MIX_COOKER,
  CellType.HOMOGENIZER, CellType.AGING_TANK, CellType.BATCH_FREEZER,
  CellType.BLAST_FREEZER, CellType.STORAGE_FREEZER, CellType.COLD_ROOM
];
const CONV_DIR = { [CellType.CONV_R]: [1,0], [CellType.CONV_L]: [-1,0], [CellType.CONV_D]: [0,1], [CellType.CONV_U]: [0,-1] };

// ============= MACHINE TEMPLATES =============
function generateShortId() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let id = '';
  for (let i = 0; i < 5; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

const MACHINE_TEMPLATES = {
  [CellType.SCALE]: {
    name: 'Scale', typeId: 'scale', size: [1,1], interval: 1, color: ['#7a8a6a','#4a5a3a','#c8c864'],
    parameters: { weight_kg: {min:0.1, max:500}, tare_kg: {min:0, max:5}, stability: {min:95, max:100} },
    anomalyProfiles: { drift: { weight_kg: {min:500, max:600}, stability: {min:50, max:70} } }
  },
  [CellType.MIXER]: {
    name: 'Mixer', typeId: 'mixer', size: [2,2], interval: 2, color: ['#6478a0','#3c506e','#64b4b4'],
    parameters: { rpm: {min:60, max:300}, temperature: {min:20, max:45}, torque_nm: {min:5, max:50} },
    anomalyProfiles: { blade_jam: { rpm: {min:0, max:10}, torque_nm: {min:80, max:120} }, overheating: { temperature: {min:60, max:80} } }
  },
  [CellType.PASTEURIZER]: {
    name: 'Pasteurizer', typeId: 'pasteurizer', size: [2,2], interval: 2, color: ['#a06478','#6e3c50','#b46464'],
    parameters: { temperature: {min:72, max:85}, pressure: {min:2.0, max:3.5}, flow_rate: {min:100, max:200} },
    anomalyProfiles: { overheating: { temperature: {min:95, max:110} }, pressure_drop: { pressure: {min:0.5, max:1.0} } }
  },
  [CellType.MIX_COOKER]: {
    name: 'Mix Cooker', typeId: 'mix_cooker', size: [2,2], interval: 3, color: ['#a08c64','#6e6440','#c8a050'],
    parameters: { temperature: {min:60, max:85}, stirring_rpm: {min:30, max:120}, viscosity: {min:2.0, max:8.0} },
    anomalyProfiles: { burn: { temperature: {min:100, max:130} }, stall: { stirring_rpm: {min:0, max:5} } }
  },
  [CellType.HOMOGENIZER]: {
    name: 'Homogenizer', typeId: 'homogenizer', size: [2,1], interval: 2, color: ['#78648c','#50406e','#b464b4'],
    parameters: { pressure_bar: {min:150, max:250}, flow_rate: {min:50, max:150}, particle_size_um: {min:0.5, max:2.0} },
    anomalyProfiles: { valve_failure: { pressure_bar: {min:10, max:30}, particle_size_um: {min:5, max:20} } }
  },
  [CellType.AGING_TANK]: {
    name: 'Aging Tank', typeId: 'aging_tank', size: [2,3], interval: 5, color: ['#6a8c8c','#405e5e','#64c8a0'],
    parameters: { temperature: {min:2, max:5}, agitation_rpm: {min:5, max:20}, level_pct: {min:20, max:95} },
    anomalyProfiles: { temp_rise: { temperature: {min:10, max:18} }, overflow: { level_pct: {min:98, max:100} } }
  },
  [CellType.BATCH_FREEZER]: {
    name: 'Batch Freezer', typeId: 'batch_freezer', size: [2,2], interval: 3, color: ['#6478b4','#3c5082','#6496c8'],
    parameters: { temperature: {min:-8, max:-4}, dasher_rpm: {min:150, max:300}, overrun_pct: {min:30, max:100} },
    anomalyProfiles: { motor_failure: { dasher_rpm: {min:0, max:20} }, freeze_lock: { temperature: {min:-25, max:-20} } }
  },
  [CellType.BLAST_FREEZER]: {
    name: 'Blast Freezer', typeId: 'blast_freezer', size: [2,4], interval: 4, color: ['#5064a0','#32406e','#5078c8'],
    parameters: { temperature: {min:-35, max:-25}, air_speed_ms: {min:3, max:8}, core_temp: {min:-18, max:-10} },
    anomalyProfiles: { compressor_fail: { temperature: {min:-5, max:0}, air_speed_ms: {min:0, max:0.5} } }
  },
  [CellType.STORAGE_FREEZER]: {
    name: 'Storage Freezer', typeId: 'storage_freezer', size: [3,3], interval: 5, color: ['#4a5a8c','#2a3a5e','#4a6eb4'],
    parameters: { temperature: {min:-25, max:-18}, humidity_pct: {min:60, max:85}, door_open: {min:0, max:0} },
    anomalyProfiles: { door_stuck: { door_open: {min:1, max:1}, temperature: {min:-10, max:0} } }
  },
  [CellType.COLD_ROOM]: {
    name: 'Cold Room', typeId: 'cold_room', size: [4,4], interval: 5, color: ['#5a6e96','#3a4a6e','#7896c8'],
    parameters: { temperature: {min:-22, max:-18}, humidity_pct: {min:70, max:90}, occupancy_pct: {min:0, max:100} },
    anomalyProfiles: { defrost_failure: { temperature: {min:-5, max:5} }, overload: { occupancy_pct: {min:100, max:100} } }
  }
};

function getMachineSize(type) { return MACHINE_TEMPLATES[type].size; }

// ============= GAME STATE =============
const grid = Array.from({length: GRID_H}, () => Array.from({length: GRID_W}, () => ({type: CellType.EMPTY, origin: null})));
let machines = [];
let materials = [];
let startPoints = [];
let endPoints = [];

let camera = {x: 0, y: 0, zoom: 1};
let dragging = false, dragStart = null, camStart = null;
let selectedTool = null;
let deleteTool = false;
let selectorTool = true;
let running = true;
let animFrame = 0, animTimer = 0;

// Truck system
let trucks = [];
const TRUCK_SPEED = 40; // pixels per second
const TRUCK_SPAWN_INTERVAL = 8; // seconds between truck spawns
let truckSpawnTimer = 0;
let outgoingTrucks = [];
const OUTGOING_TRUCK_DELAY = 5; // seconds to accumulate before truck leaves
let endPointAccumulators = {}; // {key: {count, timer}}

// ============= CANVAS SETUP =============
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const area = document.getElementById('game-area');
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============= TOOL PANEL =============
const tools = [
  {label: 'Selector', type: null, selector: true},
  {label: 'Delete', type: null, del: true},
  {label: 'Belt \u2192', type: CellType.CONV_R},
  {label: 'Belt \u2190', type: CellType.CONV_L},
  {label: 'Belt \u2193', type: CellType.CONV_D},
  {label: 'Belt \u2191', type: CellType.CONV_U},
  ...MACHINE_TYPES.map(t => {const tmpl = MACHINE_TEMPLATES[t]; return {label: tmpl.name + ' (' + tmpl.size[0] + '\u00d7' + tmpl.size[1] + ')', type: t};}),
  {label: 'Start Point', type: CellType.START},
  {label: 'End Point', type: CellType.END},
];

function buildToolPanel() {
  const container = document.getElementById('tool-buttons');
  let prevGroup = '';
  tools.forEach((t, i) => {
    // Add separators between groups
    const group = t.del ? 'util' : t.selector ? 'util' : CONVEYOR_TYPES.includes(t.type) ? 'belt' :
      MACHINE_TYPES.includes(t.type) ? 'machine' : 'point';
    if (prevGroup && group !== prevGroup) {
      const sep = document.createElement('div'); sep.className = 'tool-separator'; container.appendChild(sep);
      if (group === 'machine') {
        const lbl = document.createElement('div'); lbl.className = 'tool-section-label'; lbl.textContent = 'Machines'; container.appendChild(lbl);
      } else if (group === 'point') {
        const lbl = document.createElement('div'); lbl.className = 'tool-section-label'; lbl.textContent = 'Points'; container.appendChild(lbl);
      }
    }
    prevGroup = group;
    const btn = document.createElement('div');
    btn.className = 'tool-btn' + (t.del ? ' delete-tool' : '') + (t.selector ? ' selector-tool' : '');
    btn.dataset.index = i;
    const preview = document.createElement('canvas');
    preview.width = 22; preview.height = 22;
    preview.className = 'tool-preview';
    drawToolPreview(preview.getContext('2d'), t);
    btn.appendChild(preview);
    const lbl = document.createElement('span');
    lbl.textContent = t.label;
    btn.appendChild(lbl);
    btn.onclick = () => selectTool(i);
    container.appendChild(btn);
  });
  updateToolSelection();
}

function selectTool(index) {
  const t = tools[index];
  if (t.selector) { selectorTool = true; deleteTool = false; selectedTool = null; }
  else if (t.del) { deleteTool = true; selectorTool = false; selectedTool = null; }
  else { deleteTool = false; selectorTool = false; selectedTool = t.type; }
  hideMachinePopup();
  updateToolSelection();
}

function updateToolSelection() {
  document.querySelectorAll('.tool-btn').forEach((btn, i) => {
    const t = tools[i];
    const sel = t.selector ? selectorTool : t.del ? deleteTool : (!deleteTool && !selectorTool && selectedTool === t.type);
    btn.classList.toggle('selected', sel);
  });
}

function drawToolPreview(pctx, tool) {
  pctx.clearRect(0, 0, 22, 22);
  if (tool.selector) {
    pctx.strokeStyle = '#64b4ff'; pctx.lineWidth = 2;
    pctx.beginPath(); pctx.moveTo(5,3); pctx.lineTo(5,17); pctx.lineTo(11,13); pctx.lineTo(14,19); pctx.lineTo(17,18); pctx.lineTo(14,12); pctx.lineTo(18,10); pctx.closePath(); pctx.stroke();
  } else if (tool.del) {
    pctx.strokeStyle = '#f33'; pctx.lineWidth = 2;
    pctx.strokeRect(2, 2, 18, 18);
    pctx.beginPath(); pctx.moveTo(5,5); pctx.lineTo(17,17); pctx.stroke();
    pctx.beginPath(); pctx.moveTo(17,5); pctx.lineTo(5,17); pctx.stroke();
  } else if (CONVEYOR_TYPES.includes(tool.type)) {
    pctx.fillStyle = '#505058'; pctx.fillRect(1,1,20,20);
    pctx.fillStyle = '#c8c832';
    const cx=11,cy=11;
    pctx.beginPath();
    if (tool.type===CellType.CONV_R) { pctx.moveTo(cx+5,cy); pctx.lineTo(cx-2,cy-4); pctx.lineTo(cx-2,cy+4); }
    else if (tool.type===CellType.CONV_L) { pctx.moveTo(cx-5,cy); pctx.lineTo(cx+2,cy-4); pctx.lineTo(cx+2,cy+4); }
    else if (tool.type===CellType.CONV_D) { pctx.moveTo(cx,cy+5); pctx.lineTo(cx-4,cy-2); pctx.lineTo(cx+4,cy-2); }
    else { pctx.moveTo(cx,cy-5); pctx.lineTo(cx-4,cy+2); pctx.lineTo(cx+4,cy+2); }
    pctx.fill();
  } else if (MACHINE_TYPES.includes(tool.type)) {
    const tmpl = MACHINE_TEMPLATES[tool.type];
    pctx.fillStyle = tmpl.color[0]; pctx.fillRect(2,2,18,18);
    pctx.strokeStyle = tmpl.color[1]; pctx.strokeRect(2,2,18,18);
    pctx.fillStyle = tmpl.color[2]; pctx.beginPath(); pctx.arc(11,11,4,0,Math.PI*2); pctx.fill();
  } else if (tool.type===CellType.START) {
    pctx.fillStyle = '#1a5a2a'; pctx.fillRect(2,2,18,18);
    pctx.fillStyle = '#f0f0ff'; pctx.fillRect(7,6,8,10);
    pctx.strokeStyle = '#8080a0'; pctx.lineWidth = 0.8; pctx.strokeRect(7,6,8,10);
  } else if (tool.type===CellType.END) {
    pctx.fillStyle = '#5a1a1a'; pctx.fillRect(2,2,18,18);
    pctx.fillStyle = '#2a6a4a'; pctx.fillRect(6,6,10,10);
    pctx.fillStyle = '#ffd700'; pctx.fillRect(6,10,10,2);
    pctx.fillRect(10,6,2,10);
  }
}

// ============= COORDINATE CONVERSION =============
function screenToGrid(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  const cx = sx - rect.left;
  const cy = sy - rect.top;
  const wx = cx / camera.zoom + camera.x;
  const wy = cy / camera.zoom + camera.y;
  return [Math.floor(wx / TILE), Math.floor(wy / TILE)];
}

function gridToScreen(gx, gy) {
  return [(gx * TILE - camera.x) * camera.zoom, (gy * TILE - camera.y) * camera.zoom];
}

function validGrid(gx, gy) { return gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H; }

// ============= PLACEMENT / DELETION =============
function placeElement(gx, gy) {
  if (!validGrid(gx, gy)) return;
  if (deleteTool) { deleteElement(gx, gy); return; }

  if (MACHINE_TYPES.includes(selectedTool)) {
    const [mw, mh] = getMachineSize(selectedTool);
    if (!validGrid(gx + mw - 1, gy + mh - 1)) return;
    for (let dy = 0; dy < mh; dy++)
      for (let dx = 0; dx < mw; dx++)
        if (grid[gy+dy][gx+dx].type !== CellType.EMPTY) return;
    grid[gy][gx] = {type: selectedTool, origin: null};
    for (let dy = 0; dy < mh; dy++)
      for (let dx = 0; dx < mw; dx++)
        if (dx !== 0 || dy !== 0) grid[gy+dy][gx+dx] = {type: CellType.MACHINE_PART, origin: [gx, gy]};
    const tmpl = MACHINE_TEMPLATES[selectedTool];
    const machineId = tmpl.typeId + '-' + generateShortId();
    machines.push({id: machineId, x: gx, y: gy, type: selectedTool, inputSide: 'left', processing: false, timer: 0, matStage: 0, hasOutput: false});
    syncConfigToAPI();
  } else if (selectedTool === CellType.START) {
    if (grid[gy][gx].type !== CellType.EMPTY) return;
    grid[gy][gx] = {type: CellType.START, origin: null};
    startPoints.push({x: gx, y: gy, timer: 0});
  } else if (selectedTool === CellType.END) {
    if (grid[gy][gx].type !== CellType.EMPTY) return;
    grid[gy][gx] = {type: CellType.END, origin: null};
    endPoints.push([gx, gy]);
  } else if (CONVEYOR_TYPES.includes(selectedTool)) {
    if (grid[gy][gx].type !== CellType.EMPTY) return;
    grid[gy][gx] = {type: selectedTool, origin: null};
  }
}

function deleteElement(gx, gy) {
  if (!validGrid(gx, gy)) return;
  const cell = grid[gy][gx];
  if (cell.type === CellType.EMPTY) return;

  if (MACHINE_TYPES.includes(cell.type)) {
    const m = machines.find(m => m.x === gx && m.y === gy);
    if (m) {
      const [mw, mh] = getMachineSize(m.type);
      removeMaterialsOnCells(gx, gy, mw, mh);
      for (let dy = 0; dy < mh; dy++)
        for (let dx = 0; dx < mw; dx++)
          grid[gy+dy][gx+dx] = {type: CellType.EMPTY, origin: null};
      machines = machines.filter(x => x !== m);
      syncConfigToAPI();
    }
  } else if (cell.type === CellType.MACHINE_PART && cell.origin) {
    deleteElement(cell.origin[0], cell.origin[1]);
  } else if (cell.type === CellType.START) {
    removeMaterialsAt(gx, gy);
    grid[gy][gx] = {type: CellType.EMPTY, origin: null};
    startPoints = startPoints.filter(s => !(s.x === gx && s.y === gy));
  } else if (cell.type === CellType.END) {
    removeMaterialsAt(gx, gy);
    grid[gy][gx] = {type: CellType.EMPTY, origin: null};
    endPoints = endPoints.filter(e => !(e[0] === gx && e[1] === gy));
  } else {
    removeMaterialsAt(gx, gy);
    grid[gy][gx] = {type: CellType.EMPTY, origin: null};
  }
}

function removeMaterialsAt(gx, gy) {
  materials = materials.filter(m => !(m.gx === gx && m.gy === gy));
}
function removeMaterialsOnCells(ox, oy, w, h) {
  materials = materials.filter(m => !(m.gx >= ox && m.gx < ox+w && m.gy >= oy && m.gy < oy+h));
}

// ============= MACHINE I/O =============
function getMachineOutputCells(machine) {
  const [mw, mh] = getMachineSize(machine.type);
  const sides = {
    left: Array.from({length: mh}, (_,dy) => [machine.x - 1, machine.y + dy]),
    right: Array.from({length: mh}, (_,dy) => [machine.x + mw, machine.y + dy]),
    top: Array.from({length: mw}, (_,dx) => [machine.x + dx, machine.y - 1]),
    bottom: Array.from({length: mw}, (_,dx) => [machine.x + dx, machine.y + mh]),
  };
  const outputs = [];
  for (const [side, cells] of Object.entries(sides)) {
    if (side === machine.inputSide) continue;
    for (const [cx, cy] of cells) {
      if (validGrid(cx, cy) && CONVEYOR_TYPES.includes(grid[cy][cx].type)) {
        outputs.push([cx, cy]);
      }
    }
  }
  return outputs;
}

function getNextFromConveyor(gx, gy) {
  const cell = grid[gy][gx];
  if (CONVEYOR_TYPES.includes(cell.type)) {
    const [dx, dy] = CONV_DIR[cell.type];
    return [gx + dx, gy + dy];
  }
  return null;
}

// ============= UPDATE LOGIC =============
function updateSpawners(dt) {
  for (const sp of startPoints) {
    sp.timer += dt;
    if (sp.timer >= SPAWN_INTERVAL) {
      sp.timer = 0;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = sp.x + dx, ny = sp.y + dy;
        if (validGrid(nx, ny) && CONVEYOR_TYPES.includes(grid[ny][nx].type)) {
          if (!materials.some(m => m.gx === nx && m.gy === ny)) {
            const px = nx * TILE + TILE/2, py = ny * TILE + TILE/2;
            const next = getNextFromConveyor(nx, ny);
            let tx = px, ty = py;
            if (next && validGrid(next[0], next[1])) {
              const nc = grid[next[1]][next[0]];
              if (CONVEYOR_TYPES.includes(nc.type) || nc.type === CellType.END) {
                tx = next[0]*TILE+TILE/2; ty = next[1]*TILE+TILE/2;
              }
            }
            materials.push({x: px, y: py, gx: nx, gy: ny, stage: 'raw', moving: true, tx, ty});
            break;
          }
        }
      }
    }
  }
}

function updateMaterials(dt) {
  const toRemove = new Set();
  for (const mat of materials) {
    if (!mat.moving) continue;
    const dx = mat.tx - mat.x, dy = mat.ty - mat.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const move = MATERIAL_SPEED * TILE * dt;

    if (dist <= move) {
      mat.x = mat.tx; mat.y = mat.ty;
      mat.gx = Math.floor(mat.x / TILE);
      mat.gy = Math.floor(mat.y / TILE);

      if (endPoints.some(e => e[0] === mat.gx && e[1] === mat.gy)) { onMaterialReachEndPoint(mat.gx, mat.gy); toRemove.add(mat); continue; }

      if (validGrid(mat.gx, mat.gy)) {
        const cell = grid[mat.gy][mat.gx];
        if (CONVEYOR_TYPES.includes(cell.type)) {
          const next = getNextFromConveyor(mat.gx, mat.gy);
          if (next && validGrid(next[0], next[1])) {
            const nc = grid[next[1]][next[0]];
            if (MACHINE_TYPES.includes(nc.type) || nc.type === CellType.MACHINE_PART) {
              const origin = nc.type === CellType.MACHINE_PART ? nc.origin : [next[0], next[1]];
              if (origin) {
                const machine = machines.find(m => m.x === origin[0] && m.y === origin[1]);
                if (machine && !isMachineStopped(machine)) {
                  if (!machine.processing && !machine.hasOutput) {
                    machine.processing = true; machine.timer = MACHINE_PROCESS_TIME; machine.matStage = mat.stage;
                    // Auto-detect input side from conveyor direction
                    if (cell.type === CellType.CONV_R) machine.inputSide = 'left';
                    else if (cell.type === CellType.CONV_L) machine.inputSide = 'right';
                    else if (cell.type === CellType.CONV_D) machine.inputSide = 'top';
                    else if (cell.type === CellType.CONV_U) machine.inputSide = 'bottom';
                  }
                  toRemove.add(mat);
                }
              }
              continue;
            }
            if (CONVEYOR_TYPES.includes(nc.type) || nc.type === CellType.END) {
              mat.tx = next[0]*TILE+TILE/2; mat.ty = next[1]*TILE+TILE/2;
            } else { mat.moving = false; }
          } else { mat.moving = false; }
        } else if (cell.type === CellType.END) { onMaterialReachEndPoint(mat.gx, mat.gy); toRemove.add(mat); }
        else if (MACHINE_TYPES.includes(cell.type) || cell.type === CellType.MACHINE_PART) {
          const origin = cell.type === CellType.MACHINE_PART ? cell.origin : [mat.gx, mat.gy];
          if (origin) {
            const machine = machines.find(m => m.x === origin[0] && m.y === origin[1]);
            if (machine && !isMachineStopped(machine)) {
              if (!machine.processing && !machine.hasOutput) {
                machine.processing = true; machine.timer = MACHINE_PROCESS_TIME; machine.matStage = mat.stage;
              }
              toRemove.add(mat);
            } else { mat.moving = false; }
          } else { mat.moving = false; }
        } else { mat.moving = false; }
      } else { mat.moving = false; }
    } else {
      mat.x += (dx/dist)*move; mat.y += (dy/dist)*move;
    }
  }
  materials = materials.filter(m => !toRemove.has(m));
  // Remove stuck materials on empty cells
  materials = materials.filter(m => {
    if (m.moving) return true;
    if (!validGrid(m.gx, m.gy)) return false;
    return grid[m.gy][m.gx].type !== CellType.EMPTY;
  });
  // Reactivate stuck materials on conveyors so they retry entering machines
  for (const mat of materials) {
    if (!mat.moving && validGrid(mat.gx, mat.gy)) {
      const cell = grid[mat.gy][mat.gx];
      if (CONVEYOR_TYPES.includes(cell.type)) {
        mat.moving = true;
        mat.tx = mat.x; mat.ty = mat.y;
      } else if (MACHINE_TYPES.includes(cell.type) || cell.type === CellType.MACHINE_PART) {
        // Material stuck on a machine cell - try to enter
        mat.moving = true;
        mat.tx = mat.x; mat.ty = mat.y;
      }
    }
  }
}

function isMachineStopped(machine) {
  const status = apiStatus.find(s => s.id === machine.id);
  if (!status) return false;
  return status.state === 'Stopped' || status.state === 0;
}

function getMachineAnomaly(machine) {
  const status = apiStatus.find(s => s.id === machine.id);
  if (status && status.activeAnomaly && status.activeAnomaly !== 'none') return status.activeAnomaly;
  return null;
}

function updateMachines(dt) {
  for (const machine of machines) {
    // Stopped machines don't process
    if (isMachineStopped(machine)) {
      machine.processing = false;
      machine.hasOutput = false;
      continue;
    }
    if (machine.processing) {
      machine.timer -= dt;
      if (machine.timer <= 0) { machine.processing = false; machine.hasOutput = true; }
    }
    if (machine.hasOutput) {
      const outputs = getMachineOutputCells(machine);
      if (outputs.length === 0) { machine.hasOutput = false; continue; }
      const allFree = outputs.every(([ox,oy]) => !materials.some(m => m.gx===ox && m.gy===oy));
      if (allFree) {
        const tmpl = MACHINE_TEMPLATES[machine.type];
        const newStage = tmpl.typeId; // Output icon matches the machine that processed it
        for (const [ox, oy] of outputs) {
          const px = ox*TILE+TILE/2, py = oy*TILE+TILE/2;
          const next = getNextFromConveyor(ox, oy);
          let tx = px, ty = py;
          if (next && validGrid(next[0], next[1])) {
            const nc = grid[next[1]][next[0]];
            if (CONVEYOR_TYPES.includes(nc.type) || nc.type === CellType.END) {
              tx = next[0]*TILE+TILE/2; ty = next[1]*TILE+TILE/2;
            }
          }
          materials.push({x: px, y: py, gx: ox, gy: oy, stage: newStage, moving: true, tx, ty});
        }
        machine.hasOutput = false;
      }
    }
  }
}

function update(dt) {
  animTimer += dt;
  if (animTimer >= 0.1) { animTimer = 0; animFrame = (animFrame + 1) % 8; }
  if (running) { updateSpawners(dt); updateMaterials(dt); updateMachines(dt); updateTrucks(dt); }
}

// ============= TRUCK SYSTEM =============
function updateTrucks(dt) {
  // Spawn incoming trucks toward start points
  truckSpawnTimer += dt;
  if (truckSpawnTimer >= TRUCK_SPAWN_INTERVAL && startPoints.length > 0) {
    truckSpawnTimer = 0;
    const sp = startPoints[Math.floor(Math.random() * startPoints.length)];
    const targetX = sp.x * TILE + TILE/2;
    const targetY = sp.y * TILE + TILE/2;
    // Spawn from left side, far off-screen
    trucks.push({
      x: targetX - TILE * 12,
      y: targetY,
      targetX: targetX - TILE * 1.5,
      targetY: targetY,
      type: 'incoming',
      state: 'moving' // moving, leaving
    });
  }

  // Update incoming trucks
  for (const truck of trucks) {
    if (truck.state === 'moving') {
      const dx = truck.targetX - truck.x;
      const move = TRUCK_SPEED * dt;
      if (Math.abs(dx) <= move) {
        truck.x = truck.targetX;
        truck.state = 'leaving';
        truck.targetX = truck.x - TILE * 12;
      } else {
        truck.x += Math.sign(dx) * move;
      }
    } else if (truck.state === 'leaving') {
      truck.x -= TRUCK_SPEED * dt;
    }
  }
  // Remove trucks that left the screen
  trucks = trucks.filter(t => t.x > t.targetX - TILE*2 || t.state !== 'leaving');
  trucks = trucks.filter(t => {
    if (t.state === 'leaving') return t.x > (camera.x - TILE*5);
    return true;
  });

  // Track materials reaching end points for outgoing trucks
  for (const ep of endPoints) {
    const key = ep[0] + ',' + ep[1];
    if (!endPointAccumulators[key]) endPointAccumulators[key] = {count: 0, timer: 0};
    endPointAccumulators[key].timer += dt;
    if (endPointAccumulators[key].timer >= OUTGOING_TRUCK_DELAY && endPointAccumulators[key].count > 0) {
      // Spawn outgoing truck (goes left)
      const startX = ep[0] * TILE + TILE/2 - TILE*1.5;
      const startY = ep[1] * TILE + TILE/2;
      outgoingTrucks.push({
        x: startX,
        y: startY,
        state: 'leaving',
        cargo: endPointAccumulators[key].count
      });
      endPointAccumulators[key].count = 0;
      endPointAccumulators[key].timer = 0;
    }
  }

  // Update outgoing trucks (moving left)
  for (const truck of outgoingTrucks) {
    if (truck.state === 'leaving') {
      truck.x -= TRUCK_SPEED * dt;
    }
  }
  outgoingTrucks = outgoingTrucks.filter(t => {
    if (t.state === 'leaving') return t.x > (camera.x - TILE*8);
    return true;
  });
}

// Count materials consumed at end points (hook into material removal)
function onMaterialReachEndPoint(gx, gy) {
  const key = gx + ',' + gy;
  if (!endPointAccumulators[key]) endPointAccumulators[key] = {count: 0, timer: 0};
  endPointAccumulators[key].count++;
}

function drawTrucks() {
  const tileScreen = TILE * camera.zoom;

  // Draw incoming trucks
  for (const truck of trucks) {
    const sx = (truck.x - TILE - camera.x) * camera.zoom;
    const sy = (truck.y - TILE*0.6 - camera.y) * camera.zoom;
    const tw = TILE * 2.5 * camera.zoom;
    const th = TILE * 1.2 * camera.zoom;
    if (sx + tw < -tw || sx > canvas.width + tw) continue;
    drawIncomingTruck(sx, sy, tw, th, truck);
  }

  // Draw outgoing trucks
  for (const truck of outgoingTrucks) {
    const sx = (truck.x - TILE*0.5 - camera.x) * camera.zoom;
    const sy = (truck.y - TILE*0.6 - camera.y) * camera.zoom;
    const tw = TILE * 2.5 * camera.zoom;
    const th = TILE * 1.2 * camera.zoom;
    if (sx + tw < -tw || sx > canvas.width + tw) continue;
    drawOutgoingTruck(sx, sy, tw, th, truck);
  }
}

function drawIncomingTruck(sx, sy, tw, th, truck) {
  // Truck body (cargo area)
  ctx.fillStyle = '#5a7a4a';
  ctx.beginPath(); ctx.roundRect(sx, sy, tw*0.6, th, tw*0.03); ctx.fill();
  ctx.strokeStyle = '#3a5a2a'; ctx.lineWidth = 1.5; 
  ctx.beginPath(); ctx.roundRect(sx, sy, tw*0.6, th, tw*0.03); ctx.stroke();
  // "RAW MILK" label
  ctx.fillStyle = '#fff'; ctx.font = Math.max(7, th*0.22) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('MILK', sx + tw*0.3, sy + th*0.55); ctx.textAlign = 'left';
  // Cabin
  ctx.fillStyle = '#3a6a9a';
  ctx.beginPath(); ctx.roundRect(sx + tw*0.62, sy + th*0.15, tw*0.32, th*0.85, tw*0.03); ctx.fill();
  ctx.strokeStyle = '#2a4a6a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(sx + tw*0.62, sy + th*0.15, tw*0.32, th*0.85, tw*0.03); ctx.stroke();
  // Windshield
  ctx.fillStyle = '#a0d0f0';
  ctx.beginPath(); ctx.roundRect(sx + tw*0.72, sy + th*0.25, tw*0.18, th*0.35, tw*0.02); ctx.fill();
  // Wheels
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.arc(sx + tw*0.2, sy + th + th*0.05, th*0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.5, sy + th + th*0.05, th*0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.8, sy + th + th*0.05, th*0.15, 0, Math.PI*2); ctx.fill();
  // Wheel hubs
  ctx.fillStyle = '#666';
  ctx.beginPath(); ctx.arc(sx + tw*0.2, sy + th + th*0.05, th*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.5, sy + th + th*0.05, th*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.8, sy + th + th*0.05, th*0.06, 0, Math.PI*2); ctx.fill();
}

function drawOutgoingTruck(sx, sy, tw, th, truck) {
  // Cabin on left side (truck faces left, cabin leads)
  ctx.fillStyle = '#9a3a3a';
  ctx.beginPath(); ctx.roundRect(sx, sy + th*0.15, tw*0.32, th*0.85, tw*0.03); ctx.fill();
  ctx.strokeStyle = '#6a2a2a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(sx, sy + th*0.15, tw*0.32, th*0.85, tw*0.03); ctx.stroke();
  // Windshield
  ctx.fillStyle = '#a0d0f0';
  ctx.beginPath(); ctx.roundRect(sx + tw*0.05, sy + th*0.25, tw*0.18, th*0.35, tw*0.02); ctx.fill();
  // Cargo area (refrigerated - white/blue) on right
  ctx.fillStyle = '#e8f0ff';
  ctx.beginPath(); ctx.roundRect(sx + tw*0.34, sy, tw*0.6, th, tw*0.03); ctx.fill();
  ctx.strokeStyle = '#8ab0d0'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(sx + tw*0.34, sy, tw*0.6, th, tw*0.03); ctx.stroke();
  // Snowflake / cold indicator
  ctx.fillStyle = '#4a8ac8'; ctx.font = Math.max(8, th*0.3) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('❄', sx + tw*0.64, sy + th*0.55); ctx.textAlign = 'left';
  // "ICE CREAM" label
  ctx.fillStyle = '#4a7ab4'; ctx.font = Math.max(6, th*0.18) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('ICE CREAM', sx + tw*0.64, sy + th*0.8); ctx.textAlign = 'left';
  // Wheels
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.arc(sx + tw*0.15, sy + th + th*0.05, th*0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.5, sy + th + th*0.05, th*0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.8, sy + th + th*0.05, th*0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#666';
  ctx.beginPath(); ctx.arc(sx + tw*0.15, sy + th + th*0.05, th*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.5, sy + th + th*0.05, th*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + tw*0.8, sy + th + th*0.05, th*0.06, 0, Math.PI*2); ctx.fill();
}

// ============= DRAWING =============
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#14141e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const tileScreen = TILE * camera.zoom;
  const startGx = Math.max(0, Math.floor(camera.x / TILE));
  const startGy = Math.max(0, Math.floor(camera.y / TILE));
  const endGx = Math.min(GRID_W, Math.ceil((camera.x + canvas.width/camera.zoom) / TILE) + 1);
  const endGy = Math.min(GRID_H, Math.ceil((camera.y + canvas.height/camera.zoom) / TILE) + 1);

  // Grid background + elements
  for (let gy = startGy; gy < endGy; gy++) {
    for (let gx = startGx; gx < endGx; gx++) {
      const [sx, sy] = gridToScreen(gx, gy);
      if (sx + tileScreen < 0 || sx > canvas.width || sy + tileScreen < 0 || sy > canvas.height) continue;

      const cell = grid[gy][gx];
      if (cell.type === CellType.MACHINE_PART) continue;

      // Background
      ctx.fillStyle = (gx+gy)%2===0 ? '#1e1e28' : '#232330';
      ctx.fillRect(sx, sy, tileScreen, tileScreen);

      if (CONVEYOR_TYPES.includes(cell.type)) {
        drawConveyor(sx, sy, tileScreen, cell.type);
      } else if (MACHINE_TYPES.includes(cell.type)) {
        drawMachine(sx, sy, gx, gy, cell.type);
      } else if (cell.type === CellType.START) {
        drawStartPoint(sx, sy, tileScreen);
      } else if (cell.type === CellType.END) {
        drawEndPoint(sx, sy, tileScreen);
      }
    }
  }

  // Grid lines
  ctx.strokeStyle = '#2d2d3a'; ctx.lineWidth = 0.5;
  for (let gy = startGy; gy <= endGy; gy++) {
    const [, sy] = gridToScreen(0, gy);
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
  }
  for (let gx = startGx; gx <= endGx; gx++) {
    const [sx] = gridToScreen(gx, 0);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
  }

  // Materials
  for (const mat of materials) {
    const sx = (mat.x - TILE/2 - camera.x) * camera.zoom;
    const sy = (mat.y - TILE/2 - camera.y) * camera.zoom;
    if (sx+tileScreen<0||sx>canvas.width||sy+tileScreen<0||sy>canvas.height) continue;
    drawMaterial(sx, sy, tileScreen, mat.stage);
  }

  // Trucks
  drawTrucks();

  // Cursor
  drawCursor();

  // Status bar
  const statusEl = document.getElementById('status-bar');
  const stColor = running ? '#6f6' : '#f66';
  const stText = running ? '\u25b6 Running' : '\u23f8 Paused';
  statusEl.innerHTML = '<span style="color:'+stColor+'">'+stText+'</span> | Materials: '+materials.length+' | Machines: '+machines.length;
}

function drawConveyor(sx, sy, size, type) {
  ctx.fillStyle = '#50505a';
  ctx.fillRect(sx+1, sy+1, size-2, size-2);
  // Belt lines
  ctx.strokeStyle = '#32323c'; ctx.lineWidth = 1.5;
  const offset = animFrame * (size/8);
  const dir = CONV_DIR[type];
  if (dir[0] !== 0) {
    for (let i = 0; i < 5; i++) {
      const yy = sy + ((i * size/4 + (dir[0]>0?offset:-offset)) % size);
      if (yy >= sy && yy <= sy+size) { ctx.beginPath(); ctx.moveTo(sx+3,yy); ctx.lineTo(sx+size-3,yy); ctx.stroke(); }
    }
  } else {
    for (let i = 0; i < 5; i++) {
      const xx = sx + ((i * size/4 + (dir[1]>0?offset:-offset)) % size);
      if (xx >= sx && xx <= sx+size) { ctx.beginPath(); ctx.moveTo(xx,sy+3); ctx.lineTo(xx,sy+size-3); ctx.stroke(); }
    }
  }
  // Arrow
  const cx = sx+size/2, cy = sy+size/2;
  ctx.fillStyle = '#c8c832';
  ctx.beginPath();
  if (type===CellType.CONV_R) { ctx.moveTo(cx+size*0.2,cy); ctx.lineTo(cx-size*0.1,cy-size*0.15); ctx.lineTo(cx-size*0.1,cy+size*0.15); }
  else if (type===CellType.CONV_L) { ctx.moveTo(cx-size*0.2,cy); ctx.lineTo(cx+size*0.1,cy-size*0.15); ctx.lineTo(cx+size*0.1,cy+size*0.15); }
  else if (type===CellType.CONV_D) { ctx.moveTo(cx,cy+size*0.2); ctx.lineTo(cx-size*0.15,cy-size*0.1); ctx.lineTo(cx+size*0.15,cy-size*0.1); }
  else { ctx.moveTo(cx,cy-size*0.2); ctx.lineTo(cx-size*0.15,cy+size*0.1); ctx.lineTo(cx+size*0.15,cy+size*0.1); }
  ctx.fill();
  // Border
  ctx.strokeStyle = '#28282f'; ctx.lineWidth = 1;
  ctx.strokeRect(sx, sy, size, size);
}

function drawMachine(sx, sy, gx, gy, type) {
  const [mw, mh] = getMachineSize(type);
  const sw = mw * TILE * camera.zoom, sh = mh * TILE * camera.zoom;
  const tmpl = MACHINE_TEMPLATES[type];
  const [body, border, gear] = tmpl.color;
  const machine = machines.find(m => m.x === gx && m.y === gy);
  const stopped = machine && isMachineStopped(machine);
  const anomaly = machine ? getMachineAnomaly(machine) : null;

  // Shake offset for anomaly
  let shakeX = 0, shakeY = 0;
  if (anomaly) {
    shakeX = Math.sin(performance.now() * 0.03) * 2 * camera.zoom;
    shakeY = Math.cos(performance.now() * 0.04) * 1.5 * camera.zoom;
  }
  const dx = sx + shakeX, dy = sy + shakeY;

  // Dim stopped machines
  if (stopped) ctx.globalAlpha = 0.4;

  ctx.fillStyle = anomaly ? '#4a2020' : body; ctx.fillRect(dx+2, dy+2, sw-4, sh-4);
  ctx.strokeStyle = anomaly ? '#8a3030' : border; ctx.lineWidth = 2; ctx.strokeRect(dx+2, dy+2, sw-4, sh-4);
  // Inner panel
  ctx.fillStyle = border; ctx.globalAlpha = stopped ? 0.15 : 0.3; ctx.fillRect(dx+5, dy+5, sw-10, sh-10); ctx.globalAlpha = stopped ? 0.4 : 1;
  // Gear
  const cx = dx+sw/2, cy = dy+sh/2, r = Math.min(sw,sh)/4;
  ctx.fillStyle = gear; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.globalAlpha = stopped ? 0.1 : 0.3; ctx.beginPath(); ctx.arc(cx,cy,r*0.6,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = stopped ? 0.4 : 1;
  // Machine name label
  const fontSize = Math.max(8, Math.min(12, 10 * camera.zoom));
  ctx.font = fontSize + 'px Segoe UI'; ctx.fillStyle = '#ddd'; ctx.textAlign = 'center';
  ctx.fillText(tmpl.name, dx + sw/2, dy + fontSize + 4);
  ctx.textAlign = 'left';

  if (stopped) ctx.globalAlpha = 1;

  // Processing bar (not shown if stopped)
  if (machine && machine.processing && !stopped) {
    const progress = 1 - machine.timer / MACHINE_PROCESS_TIME;
    const barW = sw * 0.8, barH = Math.max(4, 6*camera.zoom);
    const barX = dx + sw*0.1, barY = dy + sh - barH - 4;
    ctx.fillStyle = '#3c3c3c'; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#64ff64'; ctx.fillRect(barX, barY, barW * progress, barH);
  }

  // Smoke particles for anomaly
  if (anomaly) {
    const t = performance.now() * 0.001;
    ctx.globalAlpha = 0.6;
    for (let i = 0; i < 5; i++) {
      const phase = t * 1.5 + i * 1.3;
      const life = (phase % 2) / 2; // 0..1
      const px = dx + sw * 0.2 + (i * sw * 0.15);
      const py = dy - life * sh * 0.4;
      const pr = (3 + life * 6) * camera.zoom;
      ctx.fillStyle = `rgba(80,80,80,${0.7 - life * 0.7})`;
      ctx.beginPath(); ctx.arc(px + Math.sin(phase*2)*3*camera.zoom, py, pr, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawStartPoint(sx, sy, size) {
  // Raw materials receiving dock
  ctx.fillStyle = '#1a5a2a'; ctx.fillRect(sx+2, sy+2, size-4, size-4);
  ctx.strokeStyle = '#0e3e1a'; ctx.lineWidth = 2; ctx.strokeRect(sx+2, sy+2, size-4, size-4);
  // Platform stripes
  ctx.fillStyle = '#2a7a3a';
  ctx.fillRect(sx+size*0.1, sy+size*0.7, size*0.8, size*0.06);
  ctx.fillRect(sx+size*0.1, sy+size*0.82, size*0.8, size*0.06);
  // Milk crate icon
  ctx.fillStyle = '#f0f0ff';
  ctx.fillRect(sx+size*0.3, sy+size*0.2, size*0.4, size*0.4);
  ctx.strokeStyle = '#8080a0'; ctx.lineWidth = 1;
  ctx.strokeRect(sx+size*0.3, sy+size*0.2, size*0.4, size*0.4);
  ctx.strokeRect(sx+size*0.38, sy+size*0.2, size*0.24, size*0.4);
  // Pulse
  const pulse = (animFrame % 4) * 2 * camera.zoom;
  ctx.strokeStyle = '#64ff78'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx+size/2, sy+size/2, size*0.2+pulse, 0, Math.PI*2); ctx.stroke();
}

function drawEndPoint(sx, sy, size) {
  // Distribution loading dock
  ctx.fillStyle = '#5a1a1a'; ctx.fillRect(sx+2, sy+2, size-4, size-4);
  ctx.strokeStyle = '#3e0e0e'; ctx.lineWidth = 2; ctx.strokeRect(sx+2, sy+2, size-4, size-4);
  // Platform stripes
  ctx.fillStyle = '#7a2a2a';
  ctx.fillRect(sx+size*0.1, sy+size*0.7, size*0.8, size*0.06);
  ctx.fillRect(sx+size*0.1, sy+size*0.82, size*0.8, size*0.06);
  // Ice cream box icon
  ctx.fillStyle = '#2a6a4a';
  ctx.fillRect(sx+size*0.25, sy+size*0.2, size*0.5, size*0.4);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(sx+size*0.25, sy+size*0.38, size*0.5, size*0.04);
  ctx.fillRect(sx+size*0.47, sy+size*0.2, size*0.06, size*0.4);
  // Pulse
  const pulse = (animFrame % 4) * 2 * camera.zoom;
  ctx.strokeStyle = '#ff6464'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx+size/2, sy+size/2, size*0.3+pulse, 0, Math.PI*2); ctx.stroke();
}

function drawMaterial(sx, sy, size, stage) {
  const cx = sx + size/2, cy = sy + size/2, r = size * 0.35;
  switch(stage) {
    case 'raw': // Milk bottle - raw ingredients
      drawMilkBottle(cx, cy, r);
      break;
    case 'scale': // Measured ingredient bag
      drawMeasuredBag(cx, cy, r);
      break;
    case 'mixer': // Mixed batter bowl
      drawMixedBatter(cx, cy, r);
      break;
    case 'pasteurizer': // Heated/pasteurized container
      drawPasteurizedMix(cx, cy, r);
      break;
    case 'mix_cooker': // Cooked cream
      drawCookedCream(cx, cy, r);
      break;
    case 'homogenizer': // Smooth cream drop
      drawSmoothCream(cx, cy, r);
      break;
    case 'aging_tank': // Aged/matured mix
      drawAgedMix(cx, cy, r);
      break;
    case 'batch_freezer': // Soft-serve ice cream
      drawSoftServe(cx, cy, r);
      break;
    case 'blast_freezer': // Ice cream bar
      drawIceCreamBar(cx, cy, r);
      break;
    case 'storage_freezer': // Boxed ice cream
      drawIceCreamBox(cx, cy, r);
      break;
    case 'cold_room': // Final packaged ice cream
      drawPackagedIceCream(cx, cy, r);
      break;
    default: // Fallback
      ctx.fillStyle = '#f0f0ff'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c8c8f0'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function drawMilkBottle(cx, cy, r) {
  // White milk bottle
  const bw = r*0.7, bh = r*1.4;
  ctx.fillStyle = '#f8f8ff';
  ctx.beginPath();
  ctx.moveTo(cx-bw*0.4, cy-bh*0.5); // neck top left
  ctx.lineTo(cx+bw*0.4, cy-bh*0.5); // neck top right
  ctx.lineTo(cx+bw*0.5, cy-bh*0.2); // shoulder right
  ctx.lineTo(cx+bw*0.5, cy+bh*0.5); // bottom right
  ctx.lineTo(cx-bw*0.5, cy+bh*0.5); // bottom left
  ctx.lineTo(cx-bw*0.5, cy-bh*0.2); // shoulder left
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#b0b0d0'; ctx.lineWidth = 1.2; ctx.stroke();
  // Milk level inside
  ctx.fillStyle = '#e8e8ff';
  ctx.fillRect(cx-bw*0.4, cy, bw*0.8, bh*0.4);
  // Cap
  ctx.fillStyle = '#6496c8';
  ctx.fillRect(cx-bw*0.35, cy-bh*0.55, bw*0.7, bh*0.1);
}

function drawMeasuredBag(cx, cy, r) {
  // Small ingredient bag/sack
  ctx.fillStyle = '#e8d8a0';
  ctx.beginPath();
  ctx.moveTo(cx-r*0.6, cy-r*0.3);
  ctx.quadraticCurveTo(cx-r*0.7, cy+r*0.6, cx-r*0.4, cy+r*0.7);
  ctx.lineTo(cx+r*0.4, cy+r*0.7);
  ctx.quadraticCurveTo(cx+r*0.7, cy+r*0.6, cx+r*0.6, cy-r*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#a09060'; ctx.lineWidth = 1.2; ctx.stroke();
  // Tied top
  ctx.fillStyle = '#a09060';
  ctx.beginPath();
  ctx.moveTo(cx-r*0.3, cy-r*0.3);
  ctx.lineTo(cx, cy-r*0.7);
  ctx.lineTo(cx+r*0.3, cy-r*0.3);
  ctx.closePath();
  ctx.fill();
  // Weight label
  ctx.fillStyle = '#fff'; ctx.font = Math.max(6, r*0.5) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('kg', cx, cy+r*0.3); ctx.textAlign = 'left';
}

function drawMixedBatter(cx, cy, r) {
  // Bowl with swirl
  ctx.fillStyle = '#f0e068';
  ctx.beginPath();
  ctx.ellipse(cx, cy+r*0.1, r*0.7, r*0.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#b0a030'; ctx.lineWidth = 1.2; ctx.stroke();
  // Swirl pattern
  ctx.strokeStyle = '#fff8a0'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy+r*0.1, r*0.3, 0, Math.PI*1.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy+r*0.1, r*0.15, Math.PI, Math.PI*2.5);
  ctx.stroke();
}

function drawPasteurizedMix(cx, cy, r) {
  // Container with heat waves
  ctx.fillStyle = '#ffe0a0';
  ctx.beginPath();
  ctx.roundRect(cx-r*0.5, cy-r*0.3, r*1.0, r*1.0, r*0.1);
  ctx.fill();
  ctx.strokeStyle = '#c8a050'; ctx.lineWidth = 1.2; ctx.stroke();
  // Heat waves
  ctx.strokeStyle = '#ff6432'; ctx.lineWidth = 1;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    const bx = cx + i*r*0.3;
    ctx.moveTo(bx, cy-r*0.5);
    ctx.quadraticCurveTo(bx+r*0.1, cy-r*0.7, bx, cy-r*0.9);
    ctx.stroke();
  }
}

function drawCookedCream(cx, cy, r) {
  // Pot with steam
  ctx.fillStyle = '#d4a060';
  ctx.beginPath();
  ctx.roundRect(cx-r*0.55, cy-r*0.2, r*1.1, r*0.9, r*0.08);
  ctx.fill();
  ctx.strokeStyle = '#8a6030'; ctx.lineWidth = 1.5; ctx.stroke();
  // Cream inside
  ctx.fillStyle = '#fff0c8';
  ctx.beginPath();
  ctx.ellipse(cx, cy-r*0.1, r*0.45, r*0.2, 0, 0, Math.PI*2);
  ctx.fill();
  // Steam wisps
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
  const t = performance.now() * 0.002;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    const bx = cx + (i-1)*r*0.3;
    const yOff = Math.sin(t + i) * r*0.1;
    ctx.moveTo(bx, cy-r*0.4);
    ctx.quadraticCurveTo(bx+r*0.1, cy-r*0.6+yOff, bx-r*0.05, cy-r*0.85+yOff);
    ctx.stroke();
  }
}

function drawSmoothCream(cx, cy, r) {
  // Cream drop shape
  ctx.fillStyle = '#fff5e0';
  ctx.beginPath();
  ctx.moveTo(cx, cy-r*0.8);
  ctx.quadraticCurveTo(cx+r*0.7, cy-r*0.2, cx+r*0.5, cy+r*0.4);
  ctx.quadraticCurveTo(cx, cy+r*0.8, cx-r*0.5, cy+r*0.4);
  ctx.quadraticCurveTo(cx-r*0.7, cy-r*0.2, cx, cy-r*0.8);
  ctx.fill();
  ctx.strokeStyle = '#d0c8a0'; ctx.lineWidth = 1.2; ctx.stroke();
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.ellipse(cx-r*0.15, cy-r*0.2, r*0.12, r*0.2, -0.3, 0, Math.PI*2); ctx.fill();
}

function drawAgedMix(cx, cy, r) {
  // Flask/vat with rich color (darker golden)
  ctx.fillStyle = '#c89640';
  ctx.beginPath();
  ctx.moveTo(cx-r*0.3, cy-r*0.7);
  ctx.lineTo(cx+r*0.3, cy-r*0.7);
  ctx.lineTo(cx+r*0.6, cy+r*0.1);
  ctx.quadraticCurveTo(cx+r*0.6, cy+r*0.7, cx, cy+r*0.7);
  ctx.quadraticCurveTo(cx-r*0.6, cy+r*0.7, cx-r*0.6, cy+r*0.1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#8a6420'; ctx.lineWidth = 1.2; ctx.stroke();
  // Clock/time indicator
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy-r*0.1, r*0.2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy-r*0.1); ctx.lineTo(cx, cy-r*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy-r*0.1); ctx.lineTo(cx+r*0.12, cy-r*0.05); ctx.stroke();
}

function drawSoftServe(cx, cy, r) {
  // Soft-serve cone shape
  // Cone
  ctx.fillStyle = '#d4a050';
  ctx.beginPath();
  ctx.moveTo(cx-r*0.4, cy+r*0.1);
  ctx.lineTo(cx, cy+r*0.9);
  ctx.lineTo(cx+r*0.4, cy+r*0.1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#a07830'; ctx.lineWidth = 1; ctx.stroke();
  // Cross-hatch on cone
  ctx.strokeStyle = '#b08840'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(cx-r*0.25, cy+r*0.25); ctx.lineTo(cx+r*0.15, cy+r*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+r*0.25, cy+r*0.25); ctx.lineTo(cx-r*0.15, cy+r*0.6); ctx.stroke();
  // Swirl ice cream on top
  ctx.fillStyle = '#fff0e0';
  ctx.beginPath(); ctx.ellipse(cx, cy, r*0.4, r*0.25, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy-r*0.2, r*0.32, r*0.2, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy-r*0.4, r*0.2, r*0.15, 0, 0, Math.PI*2); ctx.fill();
  // Tip
  ctx.beginPath(); ctx.arc(cx, cy-r*0.55, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#d0c0a0'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.ellipse(cx, cy, r*0.4, r*0.25, 0, 0, Math.PI*2); ctx.stroke();
}

function drawIceCreamBar(cx, cy, r) {
  // Ice cream bar on a stick
  const bw = r*0.8, bh = r*1.2;
  // Bar body
  ctx.fillStyle = '#f5d0e0';
  ctx.beginPath();
  ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh*0.75, r*0.15);
  ctx.fill();
  // Chocolate coating
  ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh*0.75, r*0.15);
  ctx.stroke();
  // Stick
  ctx.fillStyle = '#d4a050';
  ctx.fillRect(cx-r*0.08, cy+bh*0.2, r*0.16, bh*0.4);
  ctx.strokeStyle = '#a07830'; ctx.lineWidth = 0.8;
  ctx.strokeRect(cx-r*0.08, cy+bh*0.2, r*0.16, bh*0.4);
  // Bite mark / drip
  ctx.fillStyle = '#fff0f0';
  ctx.beginPath(); ctx.arc(cx+bw*0.2, cy-bh*0.1, r*0.12, 0, Math.PI*2); ctx.fill();
}

function drawIceCreamBox(cx, cy, r) {
  // Boxed ice cream tub
  const bw = r*1.2, bh = r*1.0;
  ctx.fillStyle = '#4a7ab4';
  ctx.beginPath();
  ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh, r*0.1);
  ctx.fill();
  ctx.strokeStyle = '#2a4a7a'; ctx.lineWidth = 1.5; 
  ctx.beginPath(); ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh, r*0.1); ctx.stroke();
  // Lid
  ctx.fillStyle = '#6a9ad4';
  ctx.fillRect(cx-bw/2, cy-bh/2, bw, bh*0.25);
  // Label
  ctx.fillStyle = '#fff'; ctx.font = Math.max(5, r*0.35) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('ICE', cx, cy+r*0.15); ctx.textAlign = 'left';
  // Snowflake indicator
  ctx.fillStyle = '#a0d8ff';
  ctx.beginPath(); ctx.arc(cx, cy-bh*0.15, r*0.12, 0, Math.PI*2); ctx.fill();
}

function drawPackagedIceCream(cx, cy, r) {
  // Final product: wrapped ice cream box with ribbon
  const bw = r*1.3, bh = r*1.1;
  // Box
  ctx.fillStyle = '#2a6a4a';
  ctx.beginPath(); ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh, r*0.1); ctx.fill();
  ctx.strokeStyle = '#1a4a30'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh, r*0.1); ctx.stroke();
  // Gold ribbon horizontal
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(cx-bw/2, cy-r*0.06, bw, r*0.12);
  // Gold ribbon vertical
  ctx.fillRect(cx-r*0.06, cy-bh/2, r*0.12, bh);
  // Star/seal
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(cx, cy, r*0.18, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a6a4a'; ctx.font = Math.max(5, r*0.3) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('★', cx, cy+r*0.12); ctx.textAlign = 'left';
}

function drawCursor() {
  const rect = canvas.getBoundingClientRect();
  const mx = lastMouseX - rect.left, my = lastMouseY - rect.top;
  if (mx < 0 || mx > canvas.width || my < 0 || my > canvas.height) return;
  const [gx, gy] = screenToGrid(lastMouseX, lastMouseY);
  if (!validGrid(gx, gy)) return;
  const [sx, sy] = gridToScreen(gx, gy);
  const size = TILE * camera.zoom;

  if (selectorTool) {
    ctx.strokeStyle = 'rgba(100,180,255,0.7)'; ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, size, size);
  } else if (deleteTool) {
    ctx.strokeStyle = 'rgba(255,50,50,0.7)'; ctx.lineWidth = 2; ctx.strokeRect(sx, sy, size, size);
    ctx.beginPath(); ctx.moveTo(sx+4,sy+4); ctx.lineTo(sx+size-4,sy+size-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+size-4,sy+4); ctx.lineTo(sx+4,sy+size-4); ctx.stroke();
  } else if (selectedTool && MACHINE_TYPES.includes(selectedTool)) {
    const [mw, mh] = getMachineSize(selectedTool);
    ctx.strokeStyle = 'rgba(255,255,0,0.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, size*mw, size*mh);
  } else {
    ctx.strokeStyle = 'rgba(255,255,0,0.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, size, size);
  }
}

// ============= INPUT HANDLING =============
let lastMouseX = 0, lastMouseY = 0;

canvas.addEventListener('mousemove', e => {
  lastMouseX = e.clientX; lastMouseY = e.clientY;
  if (dragging) {
    const dx = (dragStart[0] - e.clientX) / camera.zoom;
    const dy = (dragStart[1] - e.clientY) / camera.zoom;
    camera.x = camStart[0] + dx;
    camera.y = camStart[1] + dy;
  }
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    const [gx, gy] = screenToGrid(e.clientX, e.clientY);
    if (selectorTool) {
      handleSelectorClick(gx, gy, e.clientX, e.clientY);
    } else {
      placeElement(gx, gy);
    }
  } else if (e.button === 2) {
    const [gx, gy] = screenToGrid(e.clientX, e.clientY);
    deleteElement(gx, gy);
  } else if (e.button === 1) {
    dragging = true;
    dragStart = [e.clientX, e.clientY];
    camStart = [camera.x, camera.y];
    e.preventDefault();
  }
});

canvas.addEventListener('mouseup', e => { if (e.button === 1) dragging = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) camera.zoom = Math.min(3, camera.zoom * 1.1);
  else camera.zoom = Math.max(0.3, camera.zoom / 1.1);
}, {passive: false});

document.addEventListener('keydown', e => {
  const key = e.key;
  if (key === '1') { deleteTool=false; selectedTool=CellType.CONV_R; updateToolSelection(); }
  else if (key === '2') { deleteTool=false; selectedTool=CellType.CONV_L; updateToolSelection(); }
  else if (key === '3') { deleteTool=false; selectedTool=CellType.CONV_D; updateToolSelection(); }
  else if (key === '4') { deleteTool=false; selectedTool=CellType.CONV_U; updateToolSelection(); }
  else if (key === ' ') { running = !running; e.preventDefault(); }
  else if (key === 'r' || key === 'R') {
    if (!deleteTool && CONVEYOR_TYPES.includes(selectedTool)) {
      const rot = {[CellType.CONV_R]:CellType.CONV_D,[CellType.CONV_D]:CellType.CONV_L,[CellType.CONV_L]:CellType.CONV_U,[CellType.CONV_U]:CellType.CONV_R};
      selectedTool = rot[selectedTool]; updateToolSelection();
    }
  }
});

// Arrow key panning
const keysDown = new Set();
document.addEventListener('keydown', e => keysDown.add(e.key));
document.addEventListener('keyup', e => keysDown.delete(e.key));

function handlePanning(dt) {
  const speed = 300 / camera.zoom;
  if (keysDown.has('ArrowLeft')) camera.x -= speed * dt;
  if (keysDown.has('ArrowRight')) camera.x += speed * dt;
  if (keysDown.has('ArrowUp')) camera.y -= speed * dt;
  if (keysDown.has('ArrowDown')) camera.y += speed * dt;
}

// ============= API INTEGRATION =============
let apiStatus = [];
let apiTelemetry = {};

function buildAPIConfig() {
  return {
    machines: machines.map(m => {
      const tmpl = MACHINE_TEMPLATES[m.type];
      return {
        id: m.id,
        type: tmpl.typeId,
        intervalSeconds: tmpl.interval,
        parameters: tmpl.parameters,
        anomalyProfiles: tmpl.anomalyProfiles
      };
    })
  };
}

function findTemplateByTypeId(typeId) {
  for (const t of MACHINE_TYPES) {
    if (MACHINE_TEMPLATES[t].typeId === typeId) return MACHINE_TEMPLATES[t];
  }
  return null;
}

let syncTimeout = null;
function syncConfigToAPI() {
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async () => {
    const config = buildAPIConfig();
    try {
      await fetch('/simulator/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(config)});
    } catch(e) { console.warn('API sync failed:', e); }
  }, 500);
}

// ============= SELECTOR / MACHINE POPUP =============
function handleSelectorClick(gx, gy, screenX, screenY) {
  if (!validGrid(gx, gy)) { hideMachinePopup(); return; }
  const cell = grid[gy][gx];
  let machine = null;
  if (MACHINE_TYPES.includes(cell.type)) {
    machine = machines.find(m => m.x === gx && m.y === gy);
  } else if (cell.type === CellType.MACHINE_PART && cell.origin) {
    machine = machines.find(m => m.x === cell.origin[0] && m.y === cell.origin[1]);
  }
  if (machine) {
    showMachinePopup(machine, screenX, screenY);
  } else {
    hideMachinePopup();
  }
}

function showMachinePopup(machine, screenX, screenY) {
  const popup = document.getElementById('machine-popup');
  const tmpl = MACHINE_TEMPLATES[machine.type];
  const anomalyNames = Object.keys(tmpl.anomalyProfiles || {});
  const status = apiStatus.find(s => s.id === machine.id);
  const isRunning = status && (status.state === 'Running' || status.state === 1 || status.state === 'Anomaly' || status.state === 2);
  const activeAnomaly = status ? status.activeAnomaly : null;

  let html = `<h4>${tmpl.name} <span style="color:#666;font-size:11px">(${machine.id})</span></h4>`;
  html += `<div class="popup-status">State: <strong style="color:${isRunning ? '#6f6' : '#fa5'}">${isRunning ? 'Running' : 'Stopped'}</strong>`;
  if (activeAnomaly && activeAnomaly !== 'none') html += ` | Anomaly: <strong style="color:#f66">${activeAnomaly}</strong>`;
  html += `</div>`;
  html += `<div class="popup-actions">`;
  html += `<div class="popup-section">Control</div>`;
  if (isRunning) {
    html += `<button onclick="machineAction('${machine.id}','stop')">&#9209; Stop Machine</button>`;
  } else {
    html += `<button class="btn-success" onclick="machineAction('${machine.id}','start')">&#9654; Start Machine</button>`;
  }
  html += `<div class="popup-section">Anomalies</div>`;
  if (activeAnomaly && activeAnomaly !== 'none') {
    html += `<button class="btn-success" onclick="machineAction('${machine.id}','clear')">&#10004; Clear Anomaly</button>`;
  }
  for (const name of anomalyNames) {
    const profile = tmpl.anomalyProfiles[name];
    const tips = Object.entries(profile).map(([attr, range]) => {
      const normal = tmpl.parameters[attr];
      return `${attr}: ${range.min} → ${range.max} (normal: ${normal.min}–${normal.max})`;
    }).join('&#10;');
    html += `<button class="btn-danger" title="${tips}" onclick="machineAction('${machine.id}','anomaly','${name}')">&#9888; Trigger: ${name}</button>`;
  }
  html += `</div>`;

  popup.innerHTML = html;
  popup.style.display = 'block';
  // Position near click but keep on screen
  const pw = 220, ph = popup.offsetHeight || 200;
  let px = screenX + 12, py = screenY - 20;
  if (px + pw > window.innerWidth) px = screenX - pw - 12;
  if (py + ph > window.innerHeight) py = window.innerHeight - ph - 10;
  if (py < 10) py = 10;
  popup.style.left = px + 'px';
  popup.style.top = py + 'px';
}

function hideMachinePopup() {
  document.getElementById('machine-popup').style.display = 'none';
}

async function machineAction(machineId, action, anomalyName) {
  let url, method = 'POST';
  if (action === 'start') url = `/simulator/${machineId}/start`;
  else if (action === 'stop') url = `/simulator/${machineId}/stop`;
  else if (action === 'clear') url = `/simulator/${machineId}/anomaly/clear`;
  else if (action === 'anomaly') url = `/simulator/${machineId}/anomaly/${anomalyName}`;
  try {
    const res = await fetch(url, {method});
    if (res.ok) {
      showToast(`${action} → ${machineId}`);
      await fetchStatus();
      // Re-open popup with updated status
      const machine = machines.find(m => m.id === machineId);
      if (machine) {
        const popup = document.getElementById('machine-popup');
        showMachinePopup(machine, parseInt(popup.style.left), parseInt(popup.style.top) + 20);
      }
    } else {
      const err = await res.json();
      showToast(err.error || 'Action failed');
    }
  } catch(e) { showToast('API error'); }
}

// Close popup on click outside
document.addEventListener('mousedown', e => {
  const popup = document.getElementById('machine-popup');
  if (popup.style.display === 'block' && !popup.contains(e.target)) {
    const area = document.getElementById('game-area');
    if (!area.contains(e.target)) hideMachinePopup();
  }
});

async function fetchStatus() {
  try {
    const res = await fetch('/simulator/status');
    if (res.ok) apiStatus = await res.json();
  } catch(e) {}
  for (const s of apiStatus) {
    if (s.state === 'Running' || s.state === 1) {
      try {
        const res = await fetch('/simulator/' + s.id + '/telemetry');
        if (res.ok) apiTelemetry[s.id] = await res.json();
      } catch(e) {}
    }
  }
}

function renderRightPanel() {
  const container = document.getElementById('machine-cards');
  if (apiStatus.length === 0 && machines.length === 0) {
    container.innerHTML = '<p style="color:#555;font-size:12px;text-align:center">No machines placed yet</p>';
    return;
  }
  let html = '';
  for (const s of apiStatus) {
    const stateClass = s.state === 'Running' || s.state === 1 ? 'badge-running' :
                       s.state === 'Anomaly' || s.state === 2 ? 'badge-anomaly' : 'badge-stopped';
    const stateName = s.state === 1 ? 'Running' : s.state === 2 ? 'Anomaly' : s.state === 0 ? 'Stopped' : s.state;
    html += '<div class="machine-card"><h3>' + s.id + ' <span class="badge ' + stateClass + '">' + stateName + '</span></h3>';
    html += '<div style="font-size:10px;color:#666">Type: ' + s.type + ' | Interval: ' + s.intervalSeconds + 's | Sent: ' + s.messagesSent + '</div>';
    const tel = apiTelemetry[s.id];
    if (tel && tel.payload) {
      for (const [k,v] of Object.entries(tel.payload)) {
        html += '<div class="telemetry-row"><span>' + k + '</span><span>' + (typeof v==='number'?v.toFixed(2):v) + '</span></div>';
      }
    }
    const tmpl = findTemplateByTypeId(s.type);
    const anomalies = tmpl ? Object.keys(tmpl.anomalyProfiles || {}) : [];
    html += '<div class="machine-controls">';
    if (stateName === 'Running' || stateName === 'Anomaly') {
      html += '<button onclick="apiPost(\'/simulator/' + s.id + '/stop\')">Stop</button>';
    } else {
      html += '<button onclick="apiPost(\'/simulator/' + s.id + '/start\')">Start</button>';
    }
    for (const a of anomalies) {
      html += '<button onclick="apiPost(\'/simulator/' + s.id + '/anomaly/' + a + '\')">' + a + '</button>';
    }
    if (s.activeAnomaly) {
      html += '<button onclick="apiPost(\'/simulator/' + s.id + '/anomaly/clear\')">Clear</button>';
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

async function apiPost(url) {
  try { await fetch(url, {method:'POST'}); await fetchStatus(); renderRightPanel(); } catch(e) {}
}
window.apiPost = apiPost;

// Poll status every 2s
setInterval(async () => { await fetchStatus(); renderRightPanel(); }, 2000);

// ============= SAVE / LOAD =============
function showToast(msg, isError) {
  const el = document.getElementById('save-toast');
  el.textContent = msg;
  el.style.background = isError ? '#4a2a2a' : '#2a4a2a';
  el.style.color = isError ? '#f88' : '#8f8';
  el.style.borderColor = isError ? '#6a4a4a' : '#4a6a4a';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

function serializeLayout() {
  const cells = [];
  for (let gy = 0; gy < GRID_H; gy++) {
    for (let gx = 0; gx < GRID_W; gx++) {
      const c = grid[gy][gx];
      if (c.type === CellType.EMPTY) continue;
      if (c.type === CellType.MACHINE_PART) continue; // reconstructed from machine origins
      cells.push({x: gx, y: gy, type: c.type});
    }
  }
  const machineDefs = machines.map(m => ({id: m.id, x: m.x, y: m.y, type: m.type, inputSide: m.inputSide}));
  const starts = startPoints.map(s => ({x: s.x, y: s.y}));
  const ends = endPoints.map(e => ({x: e[0], y: e[1]}));
  return JSON.stringify({cells, machines: machineDefs, startPoints: starts, endPoints: ends});
}

function deserializeLayout(data) {
  // Clear everything
  for (let gy = 0; gy < GRID_H; gy++)
    for (let gx = 0; gx < GRID_W; gx++)
      grid[gy][gx] = {type: CellType.EMPTY, origin: null};
  machines = []; materials = []; startPoints = []; endPoints = [];

  // Restore conveyors and single-cell types
  for (const c of data.cells) {
    if (CONVEYOR_TYPES.includes(c.type)) {
      grid[c.y][c.x] = {type: c.type, origin: null};
    }
  }
  // Restore machines with their grid footprint
  for (const m of data.machines) {
    const tmpl = MACHINE_TEMPLATES[m.type];
    if (!tmpl) continue;
    const [mw, mh] = tmpl.size;
    grid[m.y][m.x] = {type: m.type, origin: null};
    for (let dy = 0; dy < mh; dy++)
      for (let dx = 0; dx < mw; dx++)
        if (dx !== 0 || dy !== 0) grid[m.y+dy][m.x+dx] = {type: CellType.MACHINE_PART, origin: [m.x, m.y]};
    machines.push({id: m.id, x: m.x, y: m.y, type: m.type, inputSide: m.inputSide || 'left', processing: false, timer: 0, matStage: 0, hasOutput: false});
  }
  // Restore start/end points
  for (const s of data.startPoints) {
    grid[s.y][s.x] = {type: CellType.START, origin: null};
    startPoints.push({x: s.x, y: s.y, timer: 0});
  }
  for (const e of data.endPoints) {
    grid[e.y][e.x] = {type: CellType.END, origin: null};
    endPoints.push([e.x, e.y]);
  }
}

async function saveLayout() {
  if (!confirm('Save current layout? This will overwrite the existing save.')) return;
  try {
    localStorage.setItem('factory-layout', serializeLayout());
    showToast('Layout saved');
    syncConfigToAPI();
  } catch(e) { showToast('Save failed: ' + e.message, true); }
}

async function loadLayout() {
  try {
    const saved = localStorage.getItem('factory-layout');
    const data = saved ? JSON.parse(saved) : DEFAULT_LAYOUT;
    deserializeLayout(data);
    if (saved) showToast('Layout loaded');
    syncConfigToAPI();
  } catch(e) { showToast('Load failed: ' + e.message, true); }
}

// ============= GAME LOOP =============
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  handlePanning(dt);
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
